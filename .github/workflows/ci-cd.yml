name: SmartCare Assets CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  IMAGE_NAME: smartcare-assets-api
  REGISTRY: ghcr.io/ashwin-s

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Build & Lint
  # ---------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt flake8
      - name: Run flake8
        run: python -m flake8 app/ --max-line-length=100

  # ---------------------------------------------------------------------
  # Stage 2: Automated Testing
  # ---------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio aiosqlite pytest-cov
      - name: Run test suite with coverage
        run: python -m pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=70
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------
  # Stage 3: Security Scanning (SAST + dependency audit)
  # ---------------------------------------------------------------------
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r app/ -ll
      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ---------------------------------------------------------------------
  # Stage 4: Build & Push Docker Image
  # ---------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ---------------------------------------------------------------------
  # Stage 5: Deploy to Staging (auto, on develop)
  # ---------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.smartcare-assets.hospital.internal
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH to staging host
        run: |
          echo "docker compose -f docker-compose.staging.yml pull"
          echo "docker compose -f docker-compose.staging.yml up -d"
      - name: Run smoke test against /health
        run: |
          echo "curl --fail https://staging.smartcare-assets.hospital.internal/health"
      - name: Notify team (Slack)
        if: always()
        run: echo "Posting deployment status to #smartcare-deploys"

  # ---------------------------------------------------------------------
  # Stage 6: Manual Approval Gate
  # ---------------------------------------------------------------------
  approve-production:
    name: Manual Approval for Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production-approval
    steps:
      - run: echo "Awaiting manual approval from a designated release approver"

  # ---------------------------------------------------------------------
  # Stage 7: Deploy to Production (manual gate, on main)
  # ---------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://smartcare-assets.hospital.internal
    steps:
      - uses: actions/checkout@v4
      - name: Blue-green deploy
        run: |
          echo "docker compose -f docker-compose.prod.yml up -d --no-deps api-green"
          echo "run smoke tests against api-green"
          echo "switch load balancer target from api-blue to api-green"
      - name: Tag release
        run: echo "git tag -a v$(cat VERSION) -m 'Automated production release'"
      - name: Rollback on failure
        if: failure()
        run: |
          echo "switch load balancer target back to api-blue"
          echo "docker compose -f docker-compose.prod.yml stop api-green"
      - name: Notify team (Slack + email)
        if: always()
        run: echo "Posting production deployment result to #smartcare-deploys and on-call email"
